{% extends "base.html" %}
{% block content %}

<section>
    <div class="input-group">
        <h2>Selecione a cidade</h2>

        <div class="analise-group">
            <select class="cidade-input" name="cidade" id="cidade" required>
                {% for municipio in lista_cidades %}
                    <option value="{{ municipio }}" {% if municipio == (cidade or lista_cidades[0]) %}selected{% endif %}>
                        {{ municipio }}
                    </option>
                {% endfor %}
            </select>

            <button class="btn btn-primary" id="btn-executar">Executar análise</button>
        </div>
        
        <div class="ajustar-parametros">
            <button class="btn btn-secondary" onclick="openModal()">Ajustar parâmetros</button>
        </div>

        <div id="loading"><span class="loader"></span> Processando análise...</div>
    </div>

    <div id="configModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 class="modal-title">Configurações</h2>

            <form class="modal-form" method="POST" action="{{ url_for('config') }}">

                <p class="modal-subtitle">Pesos AHP</p>
                <div id="criteriaContainer"></div>

                <p class="modal-subtitle">Classes</p>
                <div id="classesContainer"></div>

                <br><br>

                <button class="btn btn-primary" type="submit">Salvar Configurações</button>
            </form>
        </div>
    </div>

    <div id="mapa-container">
        {% if mapa_html %}
            {{ mapa_html|safe }}
        {% endif %}
    </div>
</section>


<script src="{{ url_for('static', filename='js/script.js') }}">
</script>
{% endblock %}
