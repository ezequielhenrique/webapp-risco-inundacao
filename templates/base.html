<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "GeoCritério" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="layout">
        <header class="header">
            <h1>GeoCritério</h1>
            <div class="header-actions">
                <a href="{{ url_for('sobre') }}">Sobre</a>
            </div>
        </header>

        <aside class="sidebar">
            <h3>Controles</h3>

            <!-- Você pode mover o input pra cá depois -->
            <div class="sidebar-section">
                <p>Filtros</p>
                <!-- Ex: camadas, AHP, etc -->
            </div>

            <div class="sidebar-section">
                <p>Parâmetros</p>
                <!-- Sliders AHP -->
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="loadingModal" class="loading-modal hidden">
        <div class="loading-box">
            <span class="loader"></span>
            <p>Processando análise...</p>
        </div>
    </div>
</body>
</html>
